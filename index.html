<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; frame-src 'self' https: http: data: blob:; connect-src 'self' data: blob: https://0.peerjs.com wss://0.peerjs.com; worker-src 'self' blob:;"
    />
    <title>Doodle Desk</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
  </head>
  <body style="margin: 0; padding: 0; background-color: #121212; overflow: hidden; width: 100vw; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
    <div id="root" style="width: 100%; height: 100%; background-color: #121212; display: flex; flex-direction: column;">
      <!-- Instant Startup Skeleton: Renders at 0ms before React/JS loads -->
      <style>
        @keyframes dd-shimmer {
          0% { transform: translateX(-100%); }
          100% { transform: translateX(250%); }
        }
        @keyframes dd-pulse {
          0%, 100% { opacity: 0.6; transform: scale(1); }
          50% { opacity: 1; transform: scale(1.04); }
        }
        .dd-loader-bar {
          width: 160px; height: 3px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; position: relative;
        }
        .dd-loader-progress {
          width: 50%; height: 100%; background: linear-gradient(90deg, transparent, #6366f1, #a855f7, transparent); border-radius: 99px; animation: dd-shimmer 1.4s infinite ease-in-out;
        }
      </style>
      <div style="height: 38px; background: #121214; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 12px; box-sizing: border-box; -webkit-app-region: drag;">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m12 3-1.9 5.8a2 2 0 0 1-1.28 1.28L3 12l5.8 1.9a2 2 0 0 1 1.28 1.28L12 21l1.9-5.8a2 2 0 0 1 1.28-1.28L21 12l-5.8-1.9a2 2 0 0 1-1.28-1.28Z"/>
          </svg>
          <span style="color: #e4e4e7; font-size: 13px; font-weight: 600; letter-spacing: -0.01em;">Doodle Desk</span>
          <div style="width: 1px; height: 14px; background: rgba(255,255,255,0.12); margin: 0 4px;"></div>
          <div style="display: flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);">
            <div style="width: 8px; height: 8px; border-radius: 50%; background: #3b82f6;"></div>
            <span style="color: #a1a1aa; font-size: 12px; font-weight: 500;">Main</span>
          </div>
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span style="color: #52525b; font-size: 11px;">Loading canvas…</span>
          <div class="dd-loader-bar">
            <div class="dd-loader-progress"></div>
          </div>
        </div>
      </div>
      <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at center, #18181c 0%, #121212 70%);">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; animation: dd-pulse 2.2s infinite ease-in-out;">
          <div style="width: 52px; height: 52px; border-radius: 14px; background: rgba(99,102,241,0.12); border: 1px solid rgba(99,102,241,0.25); display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(99,102,241,0.15);">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="13.5" cy="6.5" r=".5" fill="#818cf8"/>
              <circle cx="17.5" cy="10.5" r=".5" fill="#818cf8"/>
              <circle cx="8.5" cy="7.5" r=".5" fill="#818cf8"/>
              <circle cx="6.5" cy="12.5" r=".5" fill="#818cf8"/>
              <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>
            </svg>
          </div>
          <div style="color: #71717a; font-size: 12px; font-weight: 500; letter-spacing: 0.02em;">Preparing your creative canvas…</div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
